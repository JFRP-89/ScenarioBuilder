<!DOCTYPE html>
<html>
<head><title>SVG Test</title></head>
<body style="background:#0b0f14;padding:20px;">
<h2 style="color:white;">Direct SVG test (should show labels)</h2>
<div style="max-width:800px;">
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900"><defs><style type="text/css">
  /* === base resets === */
  text {
    font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', monospace;
  }

  /* --- zones (deployment) --- */
  .sb-zone-defender {
    fill: rgba(46,129,255,0.12);
    stroke: rgba(46,129,255,0.45);
    stroke-width: 1.4;
    stroke-dasharray: 8 4;
    vector-effect: non-scaling-stroke;
    stroke-linejoin: round;
  }
  .sb-zone-attacker {
    fill: rgba(255,76,76,0.12);
    stroke: rgba(255,76,76,0.45);
    stroke-width: 1.4;
    stroke-dasharray: 8 4;
    vector-effect: non-scaling-stroke;
    stroke-linejoin: round;
  }

  /* --- terrain (scenography) --- */
  .sb-terrain {
    fill: rgba(200,220,255,0.08);
    stroke: rgba(146,169,193,0.45);
    stroke-width: 1;
    vector-effect: non-scaling-stroke;
    stroke-linejoin: round;
  }
  .sb-terrain-passable {
    fill: rgba(200,220,255,0.03);
    stroke: rgba(146,169,193,0.30);
    stroke-width: 0.8;
    stroke-dasharray: 6 3 2 3;
    opacity: 0.75;
    vector-effect: non-scaling-stroke;
    stroke-linejoin: round;
  }

  /* --- objectives --- */
  .sb-objective-ring {
    fill: #101820;
    stroke: #f6d41c;
    stroke-width: 2.4;
    vector-effect: non-scaling-stroke;
  }
  .sb-objective-num {
    fill: #f6d41c;
    font-size: 22px;
    font-weight: 700;
    text-anchor: middle;
    dominant-baseline: central;
  }

  /* --- labels --- */
  .sb-label {
    fill: #92a9c1;
    font-size: 13px;
    font-weight: 600;
    text-anchor: middle;
    dominant-baseline: middle;
    paint-order: stroke fill;
    stroke: #101820;
    stroke-width: 3px;
    stroke-linejoin: round;
    vector-effect: non-scaling-stroke;
  }
  .sb-label-strong {
    fill: #e9eef6;
    font-size: 14px;
    font-weight: 700;
  }
  .sb-label-zone {
    fill: #92a9c1;
    font-size: 11px;
    font-weight: 600;
    text-anchor: middle;
    dominant-baseline: middle;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    paint-order: stroke fill;
    stroke: #101820;
    stroke-width: 3px;
    stroke-linejoin: round;
    vector-effect: non-scaling-stroke;
  }
  .sb-label-obj {
    fill: #e9eef6;
    font-size: 13px;
    font-weight: 600;
    paint-order: stroke fill;
    stroke: #101820;
    stroke-width: 3px;
    stroke-linejoin: round;
  }

  /* --- frame --- */
  .sb-frame {
    fill: none;
    stroke: rgba(246,212,28,0.35);
    stroke-width: 1.5;
    vector-effect: non-scaling-stroke;
  }
  .sb-corner-bracket {
    fill: none;
    stroke: #f6d41c;
    stroke-width: 2;
    stroke-linecap: square;
    vector-effect: non-scaling-stroke;
  }

  /* --- grid --- */
  .sb-grid-overlay {
    pointer-events: none;
  }
</style>
<pattern id="sb-grid-minor" width="50" height="50" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="50" y2="0" stroke="rgba(255,255,255,0.04)" stroke-width="0.5" /><line x1="0" y1="0" x2="0" y2="50" stroke="rgba(255,255,255,0.04)" stroke-width="0.5" /></pattern><pattern id="sb-grid-major" width="250" height="250" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="250" y2="0" stroke="rgba(246,212,28,0.08)" stroke-width="0.8" /><line x1="0" y1="0" x2="0" y2="250" stroke="rgba(246,212,28,0.08)" stroke-width="0.8" /></pattern><filter id="sb-glow-accent" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur" /><feColorMatrix in="blur" type="matrix" values="1 0 0 0 0.96  0 1 0 0 0.83  0 0 1 0 0.11  0 0 0 0.55 0" result="glow" /><feMerge><feMergeNode in="glow" /><feMergeNode in="SourceGraphic" /></feMerge></filter><pattern id="sb-hatch-defender" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="rgba(46,129,255,0.18)" stroke-width="1.5" /></pattern><pattern id="sb-hatch-attacker" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="8" stroke="rgba(255,76,76,0.18)" stroke-width="1.5" /></pattern></defs><g id="layer-bg"><rect class="sb-map-bg" x="0" y="0" width="1200" height="900" fill="#0b0f14" /><rect class="sb-table" x="0" y="0" width="1200" height="900" fill="#101820" /></g><g id="layer-grid" class="sb-grid-overlay"><rect class="sb-grid-minor" x="0" y="0" width="1200" height="900" fill="url(#sb-grid-minor)" /><rect class="sb-grid-major" x="0" y="0" width="1200" height="900" fill="url(#sb-grid-major)" /></g><g id="layer-zones"><rect x="50" y="50" width="500" height="200" fill="rgba(0,80,180,0.15)" stroke="#0050b4" stroke-width="1" vector-effect="non-scaling-stroke" stroke-linejoin="round" class="sb-zone-defender" /><rect x="50" y="50" width="500" height="200" fill="url(#sb-hatch-defender)" stroke="none" /></g><g id="layer-terrain"><rect x="300" y="200" width="200" height="150" fill="rgba(200,220,255,0.08)" stroke="rgba(146,169,193,0.45)" stroke-width="1" vector-effect="non-scaling-stroke" stroke-linejoin="round" class="sb-terrain" /></g><g id="layer-markers"><circle cx="600" cy="450" r="25" class="sb-objective-ring" fill="#101820" stroke="#f6d41c" stroke-width="2.4" vector-effect="non-scaling-stroke" filter="url(#sb-glow-accent)" /><text x="600" y="450" class="sb-objective-num" fill="#f6d41c" font-size="22" font-weight="bold" text-anchor="middle" dominant-baseline="central" font-family="'JetBrains Mono', monospace">1</text></g><g id="layer-labels"><text x="300" y="150" text-anchor="middle" dominant-baseline="middle" font-size="13" font-family="'JetBrains Mono', monospace" fill="#92a9c1" font-weight="bold" paint-order="stroke fill" stroke="#101820" stroke-width="3" stroke-linejoin="round" class="sb-label-zone">Vanguard deployment</text><text x="400" y="275" text-anchor="middle" dominant-baseline="middle" font-size="13" font-family="'JetBrains Mono', monospace" fill="#92a9c1" font-weight="bold" paint-order="stroke fill" stroke="#101820" stroke-width="3" stroke-linejoin="round" class="sb-label">Dense woodland</text><text x="600" y="400" text-anchor="middle" dominant-baseline="middle" font-size="13" font-family="'JetBrains Mono', monospace" fill="#e9eef6" font-weight="bold" paint-order="stroke fill" stroke="#101820" stroke-width="3" stroke-linejoin="round" class="sb-label-obj">Sacred ground</text></g><g id="layer-frame"><rect class="sb-frame" x="0" y="0" width="1200" height="900" fill="none" stroke="rgba(246,212,28,0.35)" stroke-width="1.5" vector-effect="non-scaling-stroke" /><line x1="0" y1="30" x2="0" y2="0" class="sb-corner-bracket" stroke="#f6d41c" stroke-width="2" /><line x1="0" y1="0" x2="30" y2="0" class="sb-corner-bracket" stroke="#f6d41c" stroke-width="2" /><line x1="1170" y1="0" x2="1200" y2="0" class="sb-corner-bracket" stroke="#f6d41c" stroke-width="2" /><line x1="1200" y1="0" x2="1200" y2="30" class="sb-corner-bracket" stroke="#f6d41c" stroke-width="2" /><line x1="1200" y1="870" x2="1200" y2="900" class="sb-corner-bracket" stroke="#f6d41c" stroke-width="2" /><line x1="1200" y1="900" x2="1170" y2="900" class="sb-corner-bracket" stroke="#f6d41c" stroke-width="2" /><line x1="30" y1="900" x2="0" y2="900" class="sb-corner-bracket" stroke="#f6d41c" stroke-width="2" /><line x1="0" y1="900" x2="0" y2="870" class="sb-corner-bracket" stroke="#f6d41c" stroke-width="2" /></g></svg>
</div>
</body>
</html>
