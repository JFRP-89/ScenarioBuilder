# =============================================================================
# Docker Compose for ScenarioBuilder — Production Stack
# =============================================================================
# Stack: PostgreSQL 16 + Combined App (FastAPI + Flask Auth/API + Gradio UI)
#
# The unified app runs on port 8000 and handles:
# - Authentication & API (Flask)
# - Interactive UI (Gradio at /sb/)
# - Shared session cookies via ASGI middleware
#
# Production requirements:
# - POSTGRES_DB, POSTGRES_USER, POSTGRES_PASSWORD must be set in .env
# - DATABASE_URL will be constructed automatically
# - Resource limits: 1 CPU / 1GB RAM per service
#
# Healthchecks enabled for orchestrators (K8s, ECS, Swarm, etc.)
# =============================================================================

services:
  # ===========================================================================
  # PostgreSQL Database
  # ===========================================================================
  db:
    image: postgres:16-alpine
    container_name: scenariobuilder-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?error}
      POSTGRES_USER: ${POSTGRES_USER:?error}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?error}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    
    # Production resource limits
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 512M
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - scenariobuilder

  # ===========================================================================
  # Combined App (FastAPI + Flask Auth/API + Gradio UI)
  # Routes:
  #  - / → redirect to /sb/
  #  - /sb/** → Gradio UI (with authentication via cookie)
  #  - /auth/**, /cards/**, /health, /login, etc. → Flask REST API
  # ===========================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: final
    container_name: scenariobuilder-app
    restart: unless-stopped
    environment:
      # Python / ASGI server
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: /app/src
      
      # Flask (production mode)
      FLASK_ENV: production
      FLASK_DEBUG: "0"
      
      # Server configuration (must match Uvicorn args below)
      HOST: 0.0.0.0
      PORT: 8000
      LOG_LEVEL: info
      
      # Database connection (REQUIRED)
      DATABASE_URL: postgresql://${POSTGRES_USER:?error}:${POSTGRES_PASSWORD:?error}@db:5432/${POSTGRES_DB:?error}
    
    # Production resource limits
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 512M
    
    command: [
      "sh", "-c",
      "alembic upgrade head && python -m uvicorn adapters.combined_app:create_combined_app --factory --host 0.0.0.0 --port 8000 --log-level info"
    ]
    ports:
      - "${PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - scenariobuilder

# =============================================================================
# Networks
# =============================================================================
networks:
  scenariobuilder:
    driver: bridge
    name: scenariobuilder-network

# =============================================================================
# Volumes
# =============================================================================
volumes:
  pgdata:
    name: scenariobuilder-pgdata
    driver: local
